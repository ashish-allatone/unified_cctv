apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unified-cctv-fss-test
  namespace: unified-cctv
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: unified-cctv-fss
  resources:
    requests:
      storage: 10Gi
