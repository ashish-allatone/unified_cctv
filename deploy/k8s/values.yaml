# Inputs for deploy/k8s/render.py (python deploy/k8s/render.py > manifests.yaml). The same values map 1:1 to
# a Helm chart; the generator is used because it can be validated without a cluster.
namespace: unified-cctv
image: registry.example.gov.in/uvp/platform:0.1
imageGpu: registry.example.gov.in/uvp/platform-gpu:0.1
publicHost: cctv.example.gov.in
storageClass: standard
# Managed / HA data services (see docs/ha.md): the platform never runs these itself in production
database_url: postgresql+psycopg://uvp:CHANGE@postgres-primary.db.svc:5432/uvp
kafka_bootstrap: kafka-0.kafka.svc:9092,kafka-1.kafka.svc:9092,kafka-2.kafka.svc:9092
es_url: http://elasticsearch.search.svc:9200
object_storage: {endpoint: "https://NAMESPACE.compat.objectstorage.ap-mumbai-1.oraclecloud.com", region: ap-mumbai-1, bucket: uvp-video}
relays: 2                    # StatefulSet replicas; cameras are spread by rendezvous hashing, failover automatic
relayRecordingsGb: 200       # local segment buffer per relay
api: {replicas: 2, cpu: "500m", memory: "1Gi", maxReplicas: 6}
anpr: {replicas: 2, cpu: "2", memory: "3Gi", gpu: false, maxReplicas: 8}   # each replica = one shard (ANPR_SHARD from the pod ordinal)
analytics: {replicas: 1, cpu: "1", memory: "2Gi"}
archiver: {replicas: 1}
adapters: {replicas: 1}
indexer: {replicas: 2}
hotlist: {replicas: 1}
keda: false                  # ScaledObject for the indexer on Kafka lag (needs KEDA installed)
