apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uvp-data
  namespace: unified-cctv
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: unified-cctv-fss-data
  resources:
    requests:
      storage: 500Gi
  volumeName: uvp-data-fss-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uvp-recordings
  namespace: unified-cctv
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: unified-cctv-fss-recordings
  resources:
    requests:
      storage: 1Ti
  volumeName: uvp-recordings-fss-pv
