apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
  namespace: unified-cctv
spec:
  serviceName: relay
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: mediamtx
        image: docker.io/bluenviron/mediamtx:1.15.1-ffmpeg
        env:
        - name: MTX_AUTHHTTPADDRESS
          value: http://api:8000/internal/relay-auth
        - name: TZ
          value: UTC
        - name: MTX_PATHDEFAULTS_RECORDPATH
          value: /recordings/$(POD_NAME)/%path/%Y-%m-%d_%H-%M-%S-%f
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RELAY_INTERNAL_USER
          value: uvp-internal
        - name: RELAY_INTERNAL_PASS
          valueFrom:
            secretKeyRef:
              name: uvp-secrets
              key: relay-internal-pass
        ports:
        - containerPort: 8554
        - containerPort: 8889
        - containerPort: 8888
        - containerPort: 9997
        - containerPort: 9996
        - containerPort: 9998
        - containerPort: 8189
          protocol: UDP
        - containerPort: 8189
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /mediamtx.yml
          subPath: mediamtx.yml
        - name: recordings
          mountPath: /recordings
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '4'
            memory: 4Gi
      volumes:
      - name: config
        configMap:
          name: uvp-config
      - name: recordings
        persistentVolumeClaim:
          claimName: uvp-recordings
      imagePullSecrets:
      - name: ocir-pull
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: unified-cctv
spec:
  clusterIP: None
  selector:
    app: relay
  ports:
  - name: rtsp
    port: 8554
  - name: whep
    port: 8889
  - name: hls
    port: 8888
  - name: api
    port: 9997
  - name: playback
    port: 9996
  - name: metrics
    port: 9998
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uvp
  namespace: unified-cctv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
spec:
  tls:
  - hosts:
    - cctv.example.gov.in
    secretName: uvp-tls
  rules:
  - host: cctv.example.gov.in
    http:
      paths:
      - path: /relay/webrtc
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 8889
      - path: /relay/hls
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 8888
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: unified-cctv
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
