global
    maxconn 1000
defaults
    mode tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    log global
    option tcplog

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# writes: Patroni answers 200 on /primary only on the current leader -> HAProxy sends traffic there
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

# reads: replicas (for reports / search replicas later)
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
