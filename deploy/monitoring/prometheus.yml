# docker compose --profile monitoring up -d   ->  Prometheus :9090, Grafana :3000 (admin / admin)
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: uvp-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: uvp-workers
    static_configs:
      - {targets: ["anpr:9101"], labels: {service: anpr}}
      - {targets: ["analytics:9102"], labels: {service: analytics}}
      - {targets: ["archiver:9103"], labels: {service: archiver}}
      - {targets: ["adapters:9104"], labels: {service: adapters}}
      - {targets: ["indexer:9105"], labels: {service: indexer}}
  - job_name: mediamtx
    static_configs: [{targets: ["relay:9998"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
