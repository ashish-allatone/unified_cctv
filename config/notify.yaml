# Notification channels and routing. Secrets via ${ENV}. Every attempt is logged (Admin → Notifications).
#
# Channel types:
#   email     SMTP (host, port, tls, user, password, from)
#   sms       any HTTP SMS gateway: url, method, headers, body template with {to} and {text}
#             (works with Twilio-compatible and Indian DLT gateways that accept JSON)
#   whatsapp  same shape; example below is the WhatsApp Cloud API text message
#   webhook   signed JSON POST (X-UVP-Signature = HMAC-SHA256 of the body) - e.g. Dial-112 / CAD intake
channels:
  control_room_email:
    type: email
    enabled: false
    host: smtp.example.gov.in
    port: 587
    tls: true
    user: ${SMTP_USER:-}
    password: ${SMTP_PASS:-}
    from: cctv-alerts@example.gov.in
  sms_gateway:
    type: sms
    enabled: false
    url: https://sms.example.in/api/send
    method: POST
    headers: {Authorization: "Bearer ${SMS_API_KEY:-}"}
    body: {sender: "CCTVPL", to: "{to}", message: "{text}"}
  whatsapp_cloud:
    type: whatsapp
    enabled: false
    url: https://graph.facebook.com/v19.0/${WA_PHONE_ID:-0}/messages
    headers: {Authorization: "Bearer ${WA_TOKEN:-}"}
    body: {messaging_product: whatsapp, to: "{to}", type: text, text: {body: "{text}"}}
  dial112_cad:
    type: webhook
    enabled: false
    url: https://cad.example.gov.in/api/cctv-events
    secret: ${CAD_WEBHOOK_SECRET:-}

# Routes: which events go where. kind: alert | incident | camera.health | break_glass | *
# Optional filters: priority (string or list), departments (list), subkind (alert match "exact"/"fuzzy"/"rule",
# incident kind, or the offence code in watchlist_plate e.g. OVER_SPEED).
routes:
  - {kind: alert, subkind: exact, priority: high, channel: sms_gateway, to: ["+919999999999"]}
  - {kind: alert, subkind: exact, channel: dial112_cad}
  - {kind: incident, priority: high, channel: whatsapp_cloud, to: ["+919999999999"]}
  - {kind: camera.health, channel: control_room_email, to: ["noc@example.gov.in"]}
  - {kind: break_glass, channel: control_room_email, to: ["security-admin@example.gov.in"]}
  # weekly ANPR accuracy report (written every Monday by the archiver) - kind "report"
  - {kind: report, channel: control_room_email, to: ["cctv-lead@example.gov.in"]}
