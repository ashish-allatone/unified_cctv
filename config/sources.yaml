# Departmental sources the platform reads from. One entry per VMS / NVR.
# Credentials come from environment variables (.env) - never write them here.
# Keep the "sources:" line at the top: every entry is indented under it.
# The two simulator departments (police, municipal) were removed. To demo again: docker compose --profile sim up -d
# and restore their entries from config/sources.example.yaml.
sources:
  # Corp8 / Sentinel grid (Gujarat Police Innovation Challenge). The web portal and its cameras.json / HLS
  # need a browser sign-in with OTP, so the platform uses the RTSP gateway directly: every connection carries the
  # registered email + access password in the URL (email @ -> %40, done automatically), TCP transport.
  - id: corp8
    department: Corp8
    name: Corp8 Sentinel cameras (challenge grid)
    adapter: rtsp_template
    host: 103.250.160.189
    rtsp_port: 8554
    main: "rtsp://{host}:{rtsp_port}/stream/cam{channel:02d}"
    username_env: CORP8_USER                  # registered email (.env)
    password_env: CORP8_PASS                  # access password (.env)
    max_concurrent_pulls: 10
    persistent_pull: true
    channels:                                 # names from the Live Grid; cam21-cam30 names to fill in; anpr on plate-facing views
      - {channel: 1, id: cam01, name: "Chiman bhai Bridge", anpr: true}
      - {channel: 2, id: cam02, name: "Janpath"}
      - {channel: 3, id: cam03, name: "O.N.G.C. Office"}
      - {channel: 4, id: cam04, name: "Paldi Circle"}
      - {channel: 5, id: cam05, name: "Visat teen Rasta"}
      - {channel: 6, id: cam06, name: "Timbavadi gate, Junagadh", anpr: true}
      - {channel: 7, id: cam07, name: "Hero showroom, Gir Somnath"}
      - {channel: 8, id: cam08, name: "Majevadi gate, Junagadh", anpr: true}
